project:
  type: website
  resources:
    - llms.txt
    - images/icon-*.png
    - images/apple-touch-icon.png
    - images/favicon-32.png
    - images/social-card.png

website:
  title: "Murali Kummitha"
  description: "Murali Kummitha (Murali K), Staff Software Engineer in Bengaluru. Writing on agentic AI systems, distributed systems, MCP, platform engineering and data."
  site-url: https://muralik.in
  favicon: images/favicon.ico
  image: images/social-card.png
  open-graph:
    locale: en_US
    site-name: "Murali Kummitha"
  twitter-card:
    creator: "@muralikummitha"
    site: "@muralikummitha"
    card-style: summary_large_image
  google-analytics: "G-96B2WQTTBR"
  page-navigation: true
  navbar:
    title: "~/muralik.in"
    logo: images/icon-192.png
    logo-alt: "Murali Kummitha logo"
    background: "#0b0f0e"
    right:
      - text: "./writing"
        href: index.qmd#writing
      - text: "./about"
        href: about.qmd
      - text: "github ↗"
        href: https://github.com/iamurali
      - icon: linkedin
        href: https://www.linkedin.com/in/muralikummitha
        aria-label: LinkedIn
      - icon: twitter-x
        href: https://twitter.com/muralikummitha
        aria-label: X / Twitter
  page-footer:
    left: "© 2026 Murali Kummitha"
    right: "exit 0"
  comments:
    giscus:
      repo: iamurali/iamurali.github.com
      theme: transparent_dark
      reactions-enabled: false

format:
  html:
    theme: [darkly, theme.scss]
    highlight-style: github-dark
    mermaid:
      theme: dark
    code-copy: true
    smooth-scroll: true
    toc-title: "// contents"
    comments: false
    canonical-url: true
    include-in-header:
      text: |
        <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
        <meta name="author" content="Murali Kummitha">
        <meta name="theme-color" content="#0b0f0e">

filters:
  - seo.lua
